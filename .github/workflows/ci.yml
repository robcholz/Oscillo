name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The design system is a sibling checkout, as on a dev machine (package.json: file:../Geist).
      - run: git clone --depth 1 https://github.com/robcholz/Geist.git ../Geist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild electron esbuild
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build
