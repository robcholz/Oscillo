name: icon-debug (temporary)
on:
  push:
    branches: [claude/tinted-icon]
jobs:
  actool:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Bisect icon.json
        shell: python3 {0}
        run: |
          import json, copy, subprocess, tempfile, shutil, os
          base = json.load(open('build/Oscillo.icon/icon.json'))
          def strip_layers(j, key):
              for g in j['groups']:
                  for l in g['layers']: l.pop(key, None)
              return j
          def no_tinted(j):
              for g in j['groups']:
                  for l in g['layers']:
                      for k in ('fill-specializations','opacity-specializations'):
                          l[k] = [s for s in l.get(k, []) if s.get('appearance') != 'tinted']
              j['fill-specializations'] = [s for s in j['fill-specializations'] if s.get('appearance') != 'tinted']
              return j
          variants = {
            'full': lambda j: j,
            'no color-space': lambda j: (j.pop('color-space-for-untagged-svg-colors'), j)[1],
            'no top fill-spec': lambda j: (j.pop('fill-specializations'), j)[1],
            'no layer fill-spec': lambda j: strip_layers(j, 'fill-specializations'),
            'no layer opacity-spec': lambda j: strip_layers(j, 'opacity-specializations'),
            'no layer position': lambda j: strip_layers(j, 'position'),
            'no layer glass': lambda j: strip_layers(j, 'glass'),
            'no tinted entries': no_tinted,
            'no group shadow/translucency': lambda j: ([ (g.pop('shadow'), g.pop('translucency')) for g in j['groups']], j)[1],
          }
          for name, f in variants.items():
              d = tempfile.mkdtemp(); shutil.copytree('build/Oscillo.icon', f'{d}/Icon.icon'); os.mkdir(f'{d}/out')
              json.dump(f(copy.deepcopy(base)), open(f'{d}/Icon.icon/icon.json', 'w'))
              r = subprocess.run(['xcrun','actool',f'{d}/Icon.icon','--compile',f'{d}/out','--output-partial-info-plist',f'{d}/out/p.plist','--app-icon','Icon','--target-device','mac','--platform','macosx','--minimum-deployment-target','26.0'], capture_output=True, text=True)
              ok = os.path.exists(f'{d}/out/Assets.car')
              print(f'=== {name}: {"OK" if ok else "FAIL"}')
