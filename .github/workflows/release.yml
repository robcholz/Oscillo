name: Release
# Publishes a release when main reaches a package.json version that has no tag yet (bump the
# version in a PR and merge it), or when a v* tag is pushed. Run by hand to get a dmg from any
# branch without publishing anything.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then publish=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then publish=true
          else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$tag, publish=$publish"
  mac:
    needs: version
    # A push to main without a new version has nothing to release.
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: node scripts/copy-dwf.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Unsigned for now; see identity: null in electron-builder.yml.
      - run: npx electron-builder --mac --publish never
      - name: Check the app bundle
        run: |
          version=$(node -p "require('./package.json').version")
          app=$(ls -d dist/mac*/Oscillo.app)
          for key in CFBundleShortVersionString CFBundleVersion; do
            got=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist")
            echo "$key=$got"
            [ "$got" = "$version" ] || { echo "::error::$key is $got, expected $version"; exit 1; }
          done
          # The WaveForms SDK and the app icon ship inside the bundle.
          test -f "$app/Contents/Frameworks/dwf.framework/dwf" || { echo "::error::dwf.framework is missing from the app"; exit 1; }
          icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist")
          test -f "$app/Contents/Resources/${icon%.icns}.icns" || { echo "::error::App icon $icon is missing"; exit 1; }
          # The trimmed bundle still type-checks scripts and loads the SDK, thinned to one architecture.
          echo "dwf.framework: $(lipo -archs "$app/Contents/Frameworks/dwf.framework/dwf")"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Oscillo" scripts/check-app.cjs "$app"
          du -sh "$app"
          ls -l dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Oscillo-mac
          path: dist/*.dmg
          if-no-files-found: error
      # Settings > Check for Updates reads the latest release and links to its dmg.
      - name: Publish GitHub Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # From main this also creates the tag, on the commit that was built.
          gh release create "$TAG" dist/*.dmg \
            --title "Oscillo ${TAG#v}" \
            --target "$GITHUB_SHA" \
            --generate-notes
