appId: com.robcholz.oscillo
compression: maximum
productName: Oscillo
copyright: Copyright © 2026 Finn Sheng
directories:
  buildResources: build
# koffi loads a native .node file, which cannot run from inside the asar archive.
asarUnpack:
  - node_modules/koffi/**
files:
  - out/**/*
  - package.json
  - build/icon.png
  # Script's type checker needs typescript.js, not the compiler CLI, language server or translated
  # messages (20 MB down to 9 MB). Its .d.ts files go to Resources (see extraResources).
  - '!node_modules/typescript/bin/**'
  - '!node_modules/typescript/lib/{_tsc,_tsserver,_typingsInstaller,tsc,tsserver,tsserverlibrary,typingsInstaller,watchGuard,cancellationToken}.js'
  - '!node_modules/typescript/lib/{cs,de,es,fr,it,ja,ko,pl,pt-br,ru,tr,zh-cn,zh-tw}/**'
# electron-builder drops every .d.ts from node_modules, so Script's type checker gets TypeScript's
# standard library from here (src/main/script-compile.ts).
extraResources:
  - from: node_modules/typescript/lib
    to: typescript
    filter: ['lib.*.d.ts', '!lib.{dom,webworker,scripthost}*.d.ts']
# Thins the WaveForms SDK to the build's architecture.
afterPack: scripts/after-pack.cjs
# Recompresses the dmg with LZMA.
artifactBuildCompleted: scripts/after-dmg.cjs
mac:
  category: public.app-category.developer-tools
  # Layered Icon Composer icon so macOS 26 can render the Default, Dark, Clear and Tinted
  # appearances. Building it needs Xcode 26 (actool); electron-builder also derives the
  # icon.icns that older macOS versions use from it.
  icon: build/Oscillo.icon
  target: dmg
  electronLanguages: [en]
  identity: null
  # The WaveForms SDK, so Oscillo runs on Macs without WaveForms installed (see libs/dwf/macos).
  extraFiles:
    - from: libs/dwf/macos/dwf.framework
      to: Frameworks/dwf.framework
      # Adept's CoolRunner CPLD maps (9 MB) are for programming CPLDs, which the SDK never does.
      filter: ['**/*', '!**/digilent/adept/data/{xbr,xpla3}/**']
# Double-clicking a workspace or project in Finder opens it in Oscillo.
fileAssociations:
  - ext: oscillo
    name: Oscillo Workspace
    role: Editor
  - ext: oscproj
    name: Oscillo Project
    role: Editor
dmg:
  artifactName: Oscillo-${version}.${ext}
  # The blockmap is for auto-update, which Oscillo doesn't use, and after-dmg.cjs rewrites the dmg.
  writeUpdateInfo: false
