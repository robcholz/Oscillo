appId: com.robcholz.oscillo
compression: maximum
productName: Oscillo
copyright: Copyright © 2026 Finn Sheng
directories:
  buildResources: build
# koffi loads a native .node file, which cannot run from inside the asar archive.
asarUnpack:
  - node_modules/koffi/**
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  target: dmg
  electronLanguages: [en]
  identity: null
dmg:
  artifactName: Oscillo-${version}.${ext}
